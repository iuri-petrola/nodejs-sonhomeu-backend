name: Build e Deploy Backend

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  BUILD:
    name: "Build backend"
    runs-on: [databasemart-sonhomeu-backend]
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Set SHORT_SHA (pegando 7 primeiros caracteres do GITHUB_SHA)
        id: set_short_sha
        run: |
          SHORT=${GITHUB_SHA:0:7}
          echo "SHORT_SHA=$SHORT" >> $GITHUB_ENV
          # também expõe como output do step (novo método via GITHUB_OUTPUT)
          echo "sha=$SHORT" >> $GITHUB_OUTPUT

      - name: Use SHORT_SHA
        run: |
          echo "SHORT_SHA via env: $SHORT_SHA"
          echo "SHORT_SHA via step output: ${{ steps.set_short_sha.outputs.sha }}"
       
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem para docker hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: | 
            iuripetrola/nodejs-someu-back:${{ env.SHORT_SHA }}
            iuripetrola/nodejs-someu-back:latest