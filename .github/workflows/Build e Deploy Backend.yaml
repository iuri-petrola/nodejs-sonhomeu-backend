name: Build e Deploy Backend

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  Build:
    name: "Build backend"
    runs-on: [databasemart-sonhomeu-backend]
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Set SHORT_SHA (pegando 8 primeiros caracteres do GITHUB_SHA)
        id: set_short_sha
        run: |
          SHORT=${GITHUB_SHA:0:8}
          echo "SHORT_SHA=$SHORT" >> $GITHUB_ENV
      
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem para docker hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: | 
            iuripetrola/nodejs-someu-back:${{ env.SHORT_SHA }}
            iuripetrola/nodejs-someu-back:latest

      - name: Executar o Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: 'iuripetrola/nodejs-someu-back:${{ env.SHORT_SHA }}'
          format: 'sarif'
          output: 'trivy-docker-result.sarif'
          severity: 'CRITICAL,HIGH'

  Deploy_Kubernetes:
    name: "Deploy kubernetes"
    needs: Build
    uses: ./.github/workflows/Deploy kubernetes.yaml
    secrets: inherit   
